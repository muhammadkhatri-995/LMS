<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub</title>
    <script src="/js/auth.js"></script>
    <script>

    <noscript><a href="/login.html">Continue to login</a></noscript>
</body>
