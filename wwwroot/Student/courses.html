<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Courses | LearnHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/auth.js"></script>
    <script>
        const allowed = Auth.requireRole("Student");
    </script>
    <style>
        /* Ambient Y2K Keyframes */
        @keyframes cyberFloat {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(-1deg);
            }
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(1000%);
            }
        }

        @keyframes glitchSnap {
            0%, 100% {
                transform: translate(0);
            }

            20% {
                transform: translate(-3px, 2px);
            }

            40% {
                transform: translate(3px, -2px);
            }

            60% {
                transform: translate(-2px, -1px);
            }

            80% {
                transform: translate(2px, 1px);
            }
        }

        @keyframes y2kPop {
            0% {
                opacity: 0;
                transform: scale(0.88) translateY(25px);
                filter: blur(10px);
            }

            60% {
                transform: scale(1.02) translateY(-4px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .animate-cyber-float {
            animation: cyberFloat 5s ease-in-out infinite;
        }

        .card-enter {
            animation: y2kPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .glitch-hover:hover {
            animation: glitchSnap 0.2s ease-in-out;
        }

        /* Y2K Tech Grid Pattern Background */
        .y2k-grid {
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
        }

        /* Y2K Glass Card Container */
        .y2k-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(186, 230, 253, 0.85);
            box-shadow: 6px 6px 0px 0px rgba(14, 165, 233, 0.15), 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 1.75rem;
        }

        /* Input & Filter Focus Glow */
        input:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25), 0 0 15px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 relative overflow-x-hidden font-sans y2k-grid">

    <!-- AMBIENT BRIGHT BLUE & CYAN BACKGROUND ORBS -->
    <div class="fixed -top-24 -left-24 w-[450px] h-[450px] bg-cyan-300/40 rounded-full blur-[100px] pointer-events-none animate-cyber-float z-0"></div>
    <div class="fixed -bottom-24 -right-24 w-[450px] h-[450px] bg-blue-300/40 rounded-full blur-[100px] pointer-events-none animate-cyber-float z-0" style="animation-direction: reverse;"></div>

    <div id="appHeader" class="relative z-10"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6 relative z-10">

        <!-- Page Header Banner -->
        <div class="y2k-card p-6 rounded-3xl relative overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- Scanline FX -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cyan-400/5 to-transparent h-12 w-full pointer-events-none animate-[scanline_8s_linear_infinite]"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-100/80 border border-sky-300 text-sky-800 text-xs font-black tracking-wider uppercase mb-2">
                    <i data-lucide="compass" class="w-3.5 h-3.5 text-sky-600"></i>
                    <span>Student Portal</span>
                </div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Browse Courses</h1>
                <p class="text-xs font-bold text-slate-500 mt-1">Explore, filter, and enroll in upcoming learning modules</p>
            </div>

            <!-- Header Badge -->
            <div class="relative z-10 flex items-center gap-3 bg-white/90 border border-sky-200 p-3.5 rounded-2xl shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-sky-500 to-cyan-400 p-[2px] shadow-md shadow-sky-500/20">
                    <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center text-blue-600 font-black">
                        <i data-lucide="book-open" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <section class="grid grid-cols-1 sm:grid-cols-12 gap-3">
            <div class="sm:col-span-8 relative group">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"></i>
                <input id="searchInput" type="search" placeholder="Search courses by title or topic..."
                       class="w-full rounded-2xl bg-white border border-slate-200 pl-10 pr-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-all font-bold shadow-sm" />
            </div>

            <div class="sm:col-span-4 relative group">
                <i data-lucide="filter" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"></i>
                <select id="categoryFilter"
                        class="w-full rounded-2xl bg-white border border-slate-200 pl-10 pr-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-all font-bold appearance-none shadow-sm cursor-pointer">
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
        </section>

        <div id="listAlert"></div>

        <!-- Course Cards Grid -->
        <section id="courseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 card-enter"></section>

        <!-- Pagination Bar -->
        <div class="y2k-card p-4 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <span id="pageInfo" class="text-xs font-black text-slate-600"></span>
            <div class="flex gap-2">
                <button id="prevBtn" type="button"
                        class="glitch-hover inline-flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-700 hover:border-blue-300 hover:text-blue-600 transition-all disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 shadow-sm">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    <span>Previous</span>
                </button>
                <button id="nextBtn" type="button"
                        class="glitch-hover inline-flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-700 hover:border-blue-300 hover:text-blue-600 transition-all disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 shadow-sm">
                    <span>Next</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/courses.js"></script>
    <script>
        if (allowed) {
            initPage();
        }

        function initPage() {
            const state = { page: 1, pageSize: 9, search: "", categoryId: "" };

            const grid = document.getElementById("courseGrid");
            const listAlert = document.getElementById("listAlert");
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const categoryFilter = document.getElementById("categoryFilter");

            Layout.renderHeader(document.getElementById("appHeader"));

            function showAlert(message, type = "error", iconName = "alert-triangle", autoDismiss = false) {
                const styles = {
                    error: "bg-rose-500/10 border-rose-300 text-rose-700",
                    success: "bg-emerald-500/10 border-emerald-300 text-emerald-700",
                    info: "bg-sky-500/10 border-sky-300 text-sky-700"
                };

                const msg = Array.isArray(message) ? message.join(" ") : message;

                listAlert.innerHTML = `
                        <div class="flex items-center gap-2.5 p-3.5 rounded-2xl border ${styles[type]} text-xs font-black backdrop-blur-md">
                            <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>
                            <span>${msg}</span>
                        </div>
                    `;
                lucide.createIcons();

                if (autoDismiss) {
                    setTimeout(() => {
                        listAlert.innerHTML = "";
                    }, 1000);
                }
            }

            function clearAlert() {
                listAlert.innerHTML = "";
            }

            function buildCard(course) {
                const link = document.createElement("a");
                link.className = "glitch-hover y2k-card overflow-hidden block group transition-all duration-300 hover:border-blue-400 hover:shadow-lg flex flex-col";
                link.href = Courses.detailsUrl(course.id);

                // Thumbnail Container
                const thumbBox = document.createElement("div");
                thumbBox.className = "relative overflow-hidden border-b border-sky-100";
                thumbBox.appendChild(Courses.thumbnail(course, "h-36 w-full object-cover group-hover:scale-105 transition-transform duration-500"));
                link.appendChild(thumbBox);

                // Body Container
                const body = document.createElement("div");
                body.className = "p-5 space-y-3 flex-1 flex flex-col justify-between";

                const topContent = document.createElement("div");
                topContent.className = "space-y-2";

                // Category Tag
                const catTag = document.createElement("span");
                catTag.className = "inline-flex items-center gap-1.5 rounded-full bg-sky-100 border border-sky-300 text-sky-900 px-2.5 py-0.5 text-xs font-black uppercase tracking-wider";
                catTag.innerHTML = `<i data-lucide="tag" class="w-3 h-3 text-sky-600"></i><span>${course.categoryName}</span>`;
                topContent.appendChild(catTag);

                // Course Title
                const titleHeading = document.createElement("h2");
                titleHeading.className = "text-base font-black text-slate-900 line-clamp-2 group-hover:text-blue-600 transition-colors pt-1";
                titleHeading.textContent = course.title;
                topContent.appendChild(titleHeading);

                // Course Description
                const descPara = document.createElement("p");
                descPara.className = "text-xs font-bold text-slate-500 line-clamp-3 leading-relaxed";
                descPara.textContent = course.description;
                topContent.appendChild(descPara);

                body.appendChild(topContent);

                // Footer Metadata
                const footer = document.createElement("div");
                footer.className = "pt-3 border-t border-sky-100 flex items-center justify-between text-xs font-extrabold text-slate-500";
                footer.innerHTML = `
                        <span class="inline-flex items-center gap-1.5 text-slate-700">
                            <i data-lucide="user" class="w-3.5 h-3.5 text-sky-600"></i>
                            ${course.instructorName}
                        </span>
                        <span class="inline-flex items-center gap-1 text-blue-600 font-black group-hover:translate-x-1 transition-transform">
                            <span>View</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </span>
                    `;
                body.appendChild(footer);

                link.appendChild(body);
                return link;
            }

            function render(data) {
                grid.replaceChildren();

                if (data.items.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "sm:col-span-2 lg:col-span-3 y2k-card p-12 text-center text-slate-500 space-y-2";
                    empty.innerHTML = `
                            <i data-lucide="search-x" class="w-10 h-10 mx-auto text-sky-400 mb-2"></i>
                            <h3 class="text-base font-black text-slate-900">No courses found</h3>
                            <p class="text-xs font-bold text-slate-500">Try adjusting your search query or selecting a different category filter.</p>
                        `;
                    grid.appendChild(empty);
                } else {
                    data.items.forEach(course => grid.appendChild(buildCard(course)));
                }

                pageInfo.textContent = Courses.pagerText(data);
                prevBtn.disabled = data.page <= 1;
                nextBtn.disabled = data.page >= Math.max(data.totalPages, 1);

                lucide.createIcons();
            }

            async function loadCourses() {
                const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });

                if (state.search) {
                    params.set("search", state.search);
                }

                if (state.categoryId) {
                    params.set("categoryId", state.categoryId);
                }

                try {
                    const data = await Api.get("/api/courses?" + params.toString());

                    if (data.items.length === 0 && data.totalCount > 0 && state.page > 1) {
                        state.page = data.totalPages;
                        await loadCourses();
                        return;
                    }

                    clearAlert();
                    render(data);
                } catch (error) {
                    showAlert(error.messages || ["Could not load courses."], "error", "x-circle");
                }
            }

            document.getElementById("searchInput").addEventListener("input", Ui.debounce((event) => {
                state.search = event.target.value.trim();
                state.page = 1;
                loadCourses();
            }, 300));

            categoryFilter.addEventListener("change", (event) => {
                state.categoryId = event.target.value;
                state.page = 1;
                loadCourses();
            });

            prevBtn.addEventListener("click", () => {
                if (state.page > 1) {
                    state.page--;
                    loadCourses();
                }
            });

            nextBtn.addEventListener("click", () => {
                state.page++;
                loadCourses();
            });

            async function start() {
                try {
                    await Courses.fillCategorySelect(categoryFilter, "All categories");
                } catch (error) {
                    showAlert(error.messages || ["Could not load categories."], "error", "alert-circle");
                }

                await loadCourses();
            }

            start();
        }
    </script>
</body>
</html>
