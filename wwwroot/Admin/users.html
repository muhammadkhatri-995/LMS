<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users | LearnHub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/auth.js"></script>
    <script>
        const allowed = Auth.requireRole("Admin");
    </script>
</head>
<body class="min-h-screen bg-slate-50">

    <div id="appHeader"></div>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

        <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-slate-800">Users</h1>
            <button id="toggleCreateBtn" type="button"
                    class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
                Add user
            </button>
        </div>

        <!-- Create user panel (hidden until "Add user" is clicked) -->
        <section id="createPanel" class="hidden bg-white rounded-xl border border-slate-200 p-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-4">New user</h2>
            <div id="createAlert" class="mb-4"></div>

            <form id="createForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4" novalidate>
                <div>
                    <label for="newFullName" class="block text-sm font-medium text-slate-700 mb-1">Full name</label>
                    <input id="newFullName" type="text"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="newEmail" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input id="newEmail" type="email"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="newPassword" type="password" autocomplete="new-password"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="newRole" class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                    <select id="newRole"
                            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Student">Student</option>
                        <option value="Instructor">Instructor</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="sm:col-span-2 flex gap-3">
                    <button id="createBtn" type="submit"
                            class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
                        Create user
                    </button>
                    <button id="cancelCreateBtn" type="button"
                            class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <!-- Filters -->
        <section class="flex flex-col sm:flex-row gap-3">
            <input id="searchInput" type="search" placeholder="Search by name or email"
                   class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <select id="roleFilter"
                    class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All roles</option>
                <option value="Student">Students</option>
                <option value="Instructor">Instructors</option>
                <option value="Admin">Admins</option>
            </select>
        </section>

        <div id="listAlert"></div>

        <!-- Table -->
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="px-4 py-3 font-medium">Name</th>
                            <th class="px-4 py-3 font-medium">Email</th>
                            <th class="px-4 py-3 font-medium">Role</th>
                            <th class="px-4 py-3 font-medium">Status</th>
                            <th class="px-4 py-3 font-medium">Created</th>
                            <th class="px-4 py-3 font-medium">Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>

            <div class="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-sm">
                <span id="pageInfo" class="text-slate-500"></span>
                <div class="flex gap-2">
                    <button id="prevBtn" type="button"
                            class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        Previous
                    </button>
                    <button id="nextBtn" type="button"
                            class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        Next
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        if (allowed) {
            initUsersPage();
        }

        function initUsersPage() {
            const state = { page: 1, pageSize: 10, search: "", role: "" };
            const currentUserId = Auth.getUser().id;

            const ROLE_STYLES = {
                Admin: "bg-purple-50 text-purple-700",
                Instructor: "bg-blue-50 text-blue-700",
                Student: "bg-slate-100 text-slate-700"
            };

            const usersBody = document.getElementById("usersBody");
            const listAlert = document.getElementById("listAlert");
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            const createPanel = document.getElementById("createPanel");
            const createForm = document.getElementById("createForm");
            const createAlert = document.getElementById("createAlert");
            const createBtn = document.getElementById("createBtn");

            Layout.renderHeader(document.getElementById("appHeader"));

            // ---------- Table ----------

            function cell(text, extraClass) {
                return Ui.el("td", "px-4 py-3 " + (extraClass || ""), text);
            }

            function badge(text, styleClass) {
                return Ui.el("span", "inline-block rounded-full px-2 py-0.5 text-xs font-medium " + styleClass, text);
            }

            function buildRow(user) {
                const row = Ui.el("tr", "border-t border-slate-100");

                row.appendChild(cell(user.fullName, "font-medium text-slate-800"));
                row.appendChild(cell(user.email, "text-slate-600 break-all"));

                const roleCell = Ui.el("td", "px-4 py-3");
                roleCell.appendChild(badge(user.role, ROLE_STYLES[user.role] || ROLE_STYLES.Student));
                row.appendChild(roleCell);

                const statusCell = Ui.el("td", "px-4 py-3");
                statusCell.appendChild(user.isActive
                    ? badge("Active", "bg-green-50 text-green-700")
                    : badge("Inactive", "bg-red-50 text-red-700"));
                row.appendChild(statusCell);

                row.appendChild(cell(Ui.formatDate(user.createdAt), "text-slate-600 whitespace-nowrap"));

                const actionCell = Ui.el("td", "px-4 py-3");
                const isSelf = user.id === currentUserId;
                const button = Ui.el(
                    "button",
                    "rounded-lg border px-3 py-1 text-xs disabled:opacity-50 disabled:cursor-not-allowed " +
                    (user.isActive
                        ? "border-red-200 text-red-700 hover:bg-red-50"
                        : "border-green-200 text-green-700 hover:bg-green-50"),
                    user.isActive ? "Deactivate" : "Activate");
                button.type = "button";

                if (isSelf) {
                    // The API also refuses this, so the button is only a convenience.
                    button.disabled = true;
                    button.title = "You cannot deactivate your own account.";
                } else {
                    button.addEventListener("click", () => toggleStatus(user, button));
                }

                actionCell.appendChild(button);
                row.appendChild(actionCell);

                return row;
            }

            function renderTable(data) {
                usersBody.replaceChildren();

                if (data.items.length === 0) {
                    const row = Ui.el("tr");
                    const empty = Ui.el("td", "px-4 py-8 text-center text-slate-500", "No users found.");
                    empty.colSpan = 6;
                    row.appendChild(empty);
                    usersBody.appendChild(row);
                } else {
                    data.items.forEach(user => usersBody.appendChild(buildRow(user)));
                }

                const totalPages = Math.max(data.totalPages, 1);
                pageInfo.textContent = "Page " + data.page + " of " + totalPages + " \u00B7 " + data.totalCount + " users";
                prevBtn.disabled = data.page <= 1;
                nextBtn.disabled = data.page >= totalPages;
            }

            async function loadUsers() {
                const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });

                if (state.search) {
                    params.set("search", state.search);
                }

                if (state.role) {
                    params.set("role", state.role);
                }

                try {
                    const data = await Api.get("/api/users?" + params.toString());

                    // Asked for a page that no longer exists (e.g. after a filter): go to the last one.
                    if (data.items.length === 0 && data.totalCount > 0 && state.page > 1) {
                        state.page = data.totalPages;
                        await loadUsers();
                        return;
                    }

                    renderTable(data);
                } catch (error) {
                    Ui.showAlert(listAlert, error.messages || ["Could not load users."]);
                }
            }

            // ---------- Activate / deactivate ----------

            async function toggleStatus(user, button) {
                const makeActive = !user.isActive;
                const verb = makeActive ? "activate" : "deactivate";

                if (!window.confirm("Are you sure you want to " + verb + " " + user.fullName + "?")) {
                    return;
                }

                button.disabled = true;

                try {
                    await Api.put("/api/users/" + user.id + "/status", { isActive: makeActive });
                    await loadUsers();
                    Ui.showAlert(listAlert, user.fullName + " was " + verb + "d.", "success");
                } catch (error) {
                    Ui.showAlert(listAlert, error.messages || ["Could not update the user."]);
                    button.disabled = false;
                }
            }

            // ---------- Filters and paging ----------

            document.getElementById("searchInput").addEventListener("input", Ui.debounce((event) => {
                state.search = event.target.value.trim();
                state.page = 1;
                Ui.clearAlert(listAlert);
                loadUsers();
            }, 300));

            document.getElementById("roleFilter").addEventListener("change", (event) => {
                state.role = event.target.value;
                state.page = 1;
                Ui.clearAlert(listAlert);
                loadUsers();
            });

            prevBtn.addEventListener("click", () => {
                if (state.page > 1) {
                    state.page--;
                    loadUsers();
                }
            });

            nextBtn.addEventListener("click", () => {
                state.page++;
                loadUsers();
            });

            // ---------- Create user ----------

            document.getElementById("toggleCreateBtn").addEventListener("click", () => {
                createPanel.classList.toggle("hidden");
                Ui.clearAlert(createAlert);
            });

            document.getElementById("cancelCreateBtn").addEventListener("click", () => {
                createForm.reset();
                createPanel.classList.add("hidden");
                Ui.clearAlert(createAlert);
            });

            createForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                Ui.clearAlert(createAlert);

                const fullName = document.getElementById("newFullName").value.trim();
                const email = document.getElementById("newEmail").value.trim();
                const password = document.getElementById("newPassword").value;
                const role = document.getElementById("newRole").value;

                if (!fullName || !email || !password) {
                    Ui.showAlert(createAlert, "Please fill in all fields.");
                    return;
                }

                Ui.setBusy(createBtn, true, "Creating...");

                try {
                    await Api.post("/api/users", { fullName, email, password, role });

                    createForm.reset();
                    createPanel.classList.add("hidden");

                    state.page = 1;
                    await loadUsers();
                    Ui.showAlert(listAlert, "User created: " + fullName + " (" + role + ").", "success");
                } catch (error) {
                    Ui.showAlert(createAlert, error.messages || ["Something went wrong. Please try again."]);
                } finally {
                    Ui.setBusy(createBtn, false);
                }
            });

            loadUsers();
        }
    </script>
</body>
</html>
