<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users | LearnHub Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/auth.js"></script>
    <script>
        const allowed = Auth.requireRole("Admin");
    </script>
</head>
<body class="min-h-screen bg-slate-50">

    <div id="appHeader"></div>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

        <div class="flex items-center justify-between">
            <h1 class="text-xl font-semibold text-slate-800">Users</h1>
            <button id="addUserBtn" type="button"
                    class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
                Add user
            </button>
        </div>

        <!-- Create / edit panel -->
        <section id="userPanel" class="hidden bg-white rounded-xl border border-slate-200 p-6">
            <h2 id="formTitle" class="text-sm font-semibold text-slate-700 mb-4">New user</h2>
            <div id="formAlert" class="mb-4"></div>

            <form id="userForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4" novalidate>
                <div>
                    <label for="formFullName" class="block text-sm font-medium text-slate-700 mb-1">Full name</label>
                    <input id="formFullName" type="text" maxlength="100"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="formEmail" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input id="formEmail" type="email" maxlength="255"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label id="passwordLabel" for="formPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="formPassword" type="password" autocomplete="new-password" maxlength="72"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <p id="passwordHint" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <div>
                    <label for="formRole" class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                    <select id="formRole"
                            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Student">Student</option>
                        <option value="Instructor">Instructor</option>
                        <option id="adminOption" value="Admin">Admin</option>
                    </select>
                    <p id="roleHint" class="hidden text-xs text-slate-500 mt-1">Changing the role signs the user out. They log in again to continue.</p>
                </div>
                <div class="sm:col-span-2 flex gap-3">
                    <button id="submitBtn" type="submit"
                            class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
                        Create user
                    </button>
                    <button id="cancelBtn" type="button"
                            class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <!-- Filters -->
        <section class="flex flex-col sm:flex-row gap-3">
            <input id="searchInput" type="search" placeholder="Search by name or email"
                   class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <select id="roleFilter"
                    class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All roles</option>
                <option value="Student">Students</option>
                <option value="Instructor">Instructors</option>
                <option value="Admin">Admins</option>
            </select>
        </section>

        <div id="listAlert"></div>

        <!-- Table -->
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="px-4 py-3 font-medium">Name</th>
                            <th class="px-4 py-3 font-medium">Email</th>
                            <th class="px-4 py-3 font-medium">Role</th>
                            <th class="px-4 py-3 font-medium">Status</th>
                            <th class="px-4 py-3 font-medium">Created</th>
                            <th class="px-4 py-3 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>

            <div class="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-sm">
                <span id="pageInfo" class="text-slate-500"></span>
                <div class="flex gap-2">
                    <button id="prevBtn" type="button"
                            class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        Previous
                    </button>
                    <button id="nextBtn" type="button"
                            class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                        Next
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        if (allowed) {
            initUsersPage();
        }

        function initUsersPage() {
            const state = { page: 1, pageSize: 10, search: "", role: "" };
            const currentUserId = Auth.getUser().id;
            let editingId = null; // null means the form is creating a new user

            const ROLE_STYLES = {
                Admin: "bg-purple-50 text-purple-700",
                Instructor: "bg-blue-50 text-blue-700",
                Student: "bg-slate-100 text-slate-700"
            };

            const usersBody = document.getElementById("usersBody");
            const listAlert = document.getElementById("listAlert");
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            const userPanel = document.getElementById("userPanel");
            const userForm = document.getElementById("userForm");
            const formTitle = document.getElementById("formTitle");
            const formAlert = document.getElementById("formAlert");
            const submitBtn = document.getElementById("submitBtn");
            const fullNameInput = document.getElementById("formFullName");
            const emailInput = document.getElementById("formEmail");
            const passwordInput = document.getElementById("formPassword");
            const passwordLabel = document.getElementById("passwordLabel");
            const passwordHint = document.getElementById("passwordHint");
            const roleSelect = document.getElementById("formRole");
            const roleHint = document.getElementById("roleHint");
            const adminOption = document.getElementById("adminOption");

            Layout.renderHeader(document.getElementById("appHeader"));

            // ---------- Create / edit form ----------

            // Pass a user to edit them, or null to create a new one.
            function openForm(user) {
                const editing = user !== null;
                editingId = editing ? user.id : null;

                userForm.reset();
                Ui.clearAlert(formAlert);

                formTitle.textContent = editing ? "Edit user" : "New user";
                submitBtn.textContent = editing ? "Save changes" : "Create user";
                passwordLabel.textContent = editing ? "New password (optional)" : "Password";
                passwordHint.textContent = editing
                    ? "Leave blank to keep the current password."
                    : "At least 8 characters, with a letter and a number.";
                roleHint.classList.toggle("hidden", !editing);

                // Admin accounts can only be created, never assigned by editing.
                adminOption.hidden = editing;
                adminOption.disabled = editing;

                if (editing) {
                    fullNameInput.value = user.fullName;
                    emailInput.value = user.email;
                    roleSelect.value = user.role;
                }

                userPanel.classList.remove("hidden");
                userPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
                fullNameInput.focus();
            }

            function closeForm() {
                editingId = null;
                userForm.reset();
                Ui.clearAlert(formAlert);
                userPanel.classList.add("hidden");
            }

            userForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                Ui.clearAlert(formAlert);

                const fullName = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const role = roleSelect.value;
                const editing = editingId !== null;

                if (!fullName || !email || (!editing && !password)) {
                    Ui.showAlert(formAlert, "Please fill in all required fields.");
                    return;
                }

                const payload = { fullName, email, role };

                if (password) {
                    payload.password = password;
                }

                Ui.setBusy(submitBtn, true, editing ? "Saving..." : "Creating...");

                try {
                    if (editing) {
                        await Api.put("/api/users/" + editingId, payload);
                    } else {
                        await Api.post("/api/users", payload);
                        state.page = 1;
                    }

                    closeForm();
                    await loadUsers();
                    Ui.showAlert(
                        listAlert,
                        editing ? "Changes saved for " + fullName + "." : "User created: " + fullName + " (" + role + ").",
                        "success");
                } catch (error) {
                    Ui.showAlert(formAlert, error.messages || ["Something went wrong. Please try again."]);
                } finally {
                    Ui.setBusy(submitBtn, false);
                }
            });

            document.getElementById("addUserBtn").addEventListener("click", () => openForm(null));
            document.getElementById("cancelBtn").addEventListener("click", closeForm);

            // ---------- Table ----------

            function cell(text, extraClass) {
                return Ui.el("td", "px-4 py-3 " + (extraClass || ""), text);
            }

            function badge(text, styleClass) {
                return Ui.el("span", "inline-block rounded-full px-2 py-0.5 text-xs font-medium " + styleClass, text);
            }

            function rowButton(label, cssClass, handler, disabledReason) {
                const button = Ui.el(
                    "button",
                    "rounded-lg border px-3 py-1 text-xs disabled:opacity-50 disabled:cursor-not-allowed " + cssClass,
                    label);
                button.type = "button";

                if (disabledReason) {
                    // The API also refuses these actions, so a disabled button is only a convenience.
                    button.disabled = true;
                    button.title = disabledReason;
                } else {
                    button.addEventListener("click", () => handler(button));
                }

                return button;
            }

            function buildRow(user) {
                const row = Ui.el("tr", "border-t border-slate-100");
                const isSelf = user.id === currentUserId;
                const isAdminRow = user.role === "Admin";

                row.appendChild(cell(user.fullName, "font-medium text-slate-800"));
                row.appendChild(cell(user.email, "text-slate-600 break-all"));

                const roleCell = Ui.el("td", "px-4 py-3");
                roleCell.appendChild(badge(user.role, ROLE_STYLES[user.role] || ROLE_STYLES.Student));
                row.appendChild(roleCell);

                const statusCell = Ui.el("td", "px-4 py-3");
                statusCell.appendChild(user.isActive
                    ? badge("Active", "bg-green-50 text-green-700")
                    : badge("Inactive", "bg-red-50 text-red-700"));
                row.appendChild(statusCell);

                row.appendChild(cell(Ui.formatDate(user.createdAt), "text-slate-600 whitespace-nowrap"));

                const actionCell = Ui.el("td", "px-4 py-3");
                const group = Ui.el("div", "flex flex-wrap gap-2");

                group.appendChild(rowButton(
                    "Edit",
                    "border-slate-300 hover:bg-slate-100",
                    () => openForm(user),
                    isAdminRow ? "Admin accounts are edited from the Profile page." : null));

                group.appendChild(rowButton(
                    user.isActive ? "Deactivate" : "Activate",
                    user.isActive
                        ? "border-amber-200 text-amber-700 hover:bg-amber-50"
                        : "border-green-200 text-green-700 hover:bg-green-50",
                    (button) => toggleStatus(user, button),
                    isSelf ? "You cannot deactivate your own account." : null));

                group.appendChild(rowButton(
                    "Delete",
                    "border-red-200 text-red-700 hover:bg-red-50",
                    (button) => deleteUser(user, button),
                    isAdminRow ? "Admin accounts cannot be deleted here." : null));

                actionCell.appendChild(group);
                row.appendChild(actionCell);

                return row;
            }

            function renderTable(data) {
                usersBody.replaceChildren();

                if (data.items.length === 0) {
                    const row = Ui.el("tr");
                    const empty = Ui.el("td", "px-4 py-8 text-center text-slate-500", "No users found.");
                    empty.colSpan = 6;
                    row.appendChild(empty);
                    usersBody.appendChild(row);
                } else {
                    data.items.forEach(user => usersBody.appendChild(buildRow(user)));
                }

                const totalPages = Math.max(data.totalPages, 1);
                pageInfo.textContent = "Page " + data.page + " of " + totalPages + " \u00B7 " + data.totalCount + " users";
                prevBtn.disabled = data.page <= 1;
                nextBtn.disabled = data.page >= totalPages;
            }

            async function loadUsers() {
                const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });

                if (state.search) {
                    params.set("search", state.search);
                }

                if (state.role) {
                    params.set("role", state.role);
                }

                try {
                    const data = await Api.get("/api/users?" + params.toString());

                    // Asked for a page that no longer exists (e.g. after a delete): go to the last one.
                    if (data.items.length === 0 && data.totalCount > 0 && state.page > 1) {
                        state.page = data.totalPages;
                        await loadUsers();
                        return;
                    }

                    renderTable(data);
                } catch (error) {
                    Ui.showAlert(listAlert, error.messages || ["Could not load users."]);
                }
            }

            // ---------- Activate / deactivate / delete ----------

            async function toggleStatus(user, button) {
                const makeActive = !user.isActive;
                const verb = makeActive ? "activate" : "deactivate";

                if (!window.confirm("Are you sure you want to " + verb + " " + user.fullName + "?")) {
                    return;
                }

                button.disabled = true;

                try {
                    await Api.put("/api/users/" + user.id + "/status", { isActive: makeActive });
                    await loadUsers();
                    Ui.showAlert(listAlert, user.fullName + " was " + verb + "d.", "success");
                } catch (error) {
                    Ui.showAlert(listAlert, error.messages || ["Could not update the user."]);
                    button.disabled = false;
                }
            }

            async function deleteUser(user, button) {
                const question = "Permanently delete " + user.fullName + " (" + user.email + ")? This cannot be undone.";

                if (!window.confirm(question)) {
                    return;
                }

                button.disabled = true;

                try {
                    await Api.del("/api/users/" + user.id);
                    await loadUsers();
                    Ui.showAlert(listAlert, user.fullName + " was deleted.", "success");
                } catch (error) {
                    // For example: "This user owns courses and cannot be deleted. Deactivate the account instead."
                    Ui.showAlert(listAlert, error.messages || ["Could not delete the user."]);
                    button.disabled = false;
                }
            }

            // ---------- Filters and paging ----------

            document.getElementById("searchInput").addEventListener("input", Ui.debounce((event) => {
                state.search = event.target.value.trim();
                state.page = 1;
                Ui.clearAlert(listAlert);
                loadUsers();
            }, 300));

            document.getElementById("roleFilter").addEventListener("change", (event) => {
                state.role = event.target.value;
                state.page = 1;
                Ui.clearAlert(listAlert);
                loadUsers();
            });

            prevBtn.addEventListener("click", () => {
                if (state.page > 1) {
                    state.page--;
                    loadUsers();
                }
            });

            nextBtn.addEventListener("click", () => {
                state.page++;
                loadUsers();
            });

            loadUsers();
        }
    </script>
</body>
</html>
