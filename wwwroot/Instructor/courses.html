<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses | LearnHub Instructor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/auth.js"></script>
    <script>
        const allowed = Auth.requireRole("Instructor");
    </script>
    <style>
        /* Y2K Keyframe Animations */
        @keyframes cyberFloat {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(-1deg);
            }
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(1000%);
            }
        }

        @keyframes glitchSnap {
            0%, 100% {
                transform: translate(0);
            }

            20% {
                transform: translate(-3px, 2px);
            }

            40% {
                transform: translate(3px, -2px);
            }

            60% {
                transform: translate(-2px, -1px);
            }

            80% {
                transform: translate(2px, 1px);
            }
        }

        @keyframes y2kPop {
            0% {
                opacity: 0;
                transform: scale(0.88) translateY(25px);
                filter: blur(10px);
            }

            60% {
                transform: scale(1.02) translateY(-4px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .animate-cyber-float {
            animation: cyberFloat 5s ease-in-out infinite;
        }

        .card-enter {
            animation: y2kPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .glitch-hover:hover {
            animation: glitchSnap 0.2s ease-in-out;
        }

        /* Y2K Tech Grid Pattern Background */
        .y2k-grid {
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
        }

        /* Y2K Glass Card Container */
        .y2k-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(186, 230, 253, 0.85);
            box-shadow: 6px 6px 0px 0px rgba(14, 165, 233, 0.15), 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 1.75rem;
        }

        /* Input & Filter Focus Pulse */
        input:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25), 0 0 15px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 relative overflow-x-hidden font-sans y2k-grid">

    <!-- AMBIENT BRIGHT BLUE & CYAN BACKGROUND ORBS -->
    <div class="fixed -top-24 -left-24 w-[450px] h-[450px] bg-cyan-300/40 rounded-full blur-[100px] pointer-events-none animate-cyber-float z-0"></div>
    <div class="fixed -bottom-24 -right-24 w-[450px] h-[450px] bg-blue-300/40 rounded-full blur-[100px] pointer-events-none animate-cyber-float z-0" style="animation-direction: reverse;"></div>

    <div id="appHeader" class="relative z-10"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8 relative z-10">

        <!-- Page Header Banner -->
        <div class="y2k-card p-6 rounded-3xl relative overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- Scanline FX -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cyan-400/5 to-transparent h-12 w-full pointer-events-none animate-[scanline_8s_linear_infinite]"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-100/80 border border-sky-300 text-sky-800 text-xs font-black tracking-wider uppercase mb-2">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-sky-600"></i>
                    <span>Instructor Studio</span>
                </div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">My Courses</h1>
                <p class="text-xs font-bold text-slate-500 mt-1">Manage, update, and publish your instructional curriculum</p>
            </div>

            <!-- Create Course Action Button -->
            <div class="relative z-10">
                <a href="/instructor/create-course.html"
                   class="glitch-hover inline-flex items-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 via-sky-600 to-cyan-600 text-white px-5 py-3 text-xs font-black transition-all shadow-md active:scale-95 hover:from-blue-700 hover:to-cyan-700">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Create Course</span>
                </a>
            </div>
        </div>

        <!-- Search & Filter Controls -->
        <section class="grid grid-cols-1 sm:grid-cols-12 gap-3">
            <div class="sm:col-span-8 relative group">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"></i>
                <input id="searchInput" type="search" placeholder="Search my courses..."
                       class="w-full rounded-2xl bg-white border border-slate-200 pl-10 pr-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-all font-bold shadow-sm" />
            </div>

            <div class="sm:col-span-4 relative group">
                <i data-lucide="activity" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"></i>
                <select id="statusFilter"
                        class="w-full rounded-2xl bg-white border border-slate-200 pl-10 pr-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-blue-500 transition-all font-bold appearance-none shadow-sm cursor-pointer">
                    <option value="">All Statuses</option>
                    <option value="Draft">Draft</option>
                    <option value="Published">Published</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
        </section>

        <div id="listAlert"></div>

        <!-- Table Container -->
        <section class="y2k-card overflow-hidden card-enter relative">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-sky-50/70 border-b border-sky-100 text-slate-700 font-black text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-5 py-4">Title</th>
                            <th class="px-5 py-4">Category</th>
                            <th class="px-5 py-4">Status</th>
                            <th class="px-5 py-4">Updated</th>
                            <th class="px-5 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courseBody" class="divide-y divide-sky-100"></tbody>
                </table>
            </div>

            <!-- Table Footer & Pagination -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border-t border-sky-100">
                <span id="pageInfo" class="text-xs font-black text-slate-600"></span>
                <div class="flex gap-2">
                    <button id="prevBtn" type="button"
                            class="glitch-hover inline-flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-700 hover:border-blue-300 hover:text-blue-600 transition-all disabled:opacity-40 disabled:cursor-not-allowed active:scale-95">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span>Previous</span>
                    </button>
                    <button id="nextBtn" type="button"
                            class="glitch-hover inline-flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-700 hover:border-blue-300 hover:text-blue-600 transition-all disabled:opacity-40 disabled:cursor-not-allowed active:scale-95">
                        <span>Next</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/courses.js"></script>
    <script>
        if (allowed) {
            initPage();
        }

        function initPage() {
            const state = { page: 1, pageSize: 10, search: "", status: "" };

            const body = document.getElementById("courseBody");
            const listAlert = document.getElementById("listAlert");
            const pageInfo = document.getElementById("pageInfo");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            Layout.renderHeader(document.getElementById("appHeader"));

            if (new URLSearchParams(window.location.search).get("deleted")) {
                showAlert("Course deleted.", "success", "trash-2", true);
            }

            function smallButton(label, cssClass, iconName, handler) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "glitch-hover inline-flex items-center gap-1.5 rounded-xl border px-3 py-1.5 text-xs font-black transition-all active:scale-95 disabled:opacity-50 " + cssClass;
                button.innerHTML = `<i data-lucide="${iconName}" class="w-3.5 h-3.5"></i><span>${label}</span>`;
                button.addEventListener("click", () => handler(button));
                return button;
            }

            function buildRow(course) {
                const row = document.createElement("tr");
                row.className = "hover:bg-sky-50/50 transition-colors group";

                // Title Cell with SVG Icon
                const titleCell = document.createElement("td");
                titleCell.className = "px-5 py-4";

                const titleWrapper = document.createElement("div");
                titleWrapper.className = "flex items-center gap-3";

                const titleIcon = document.createElement("div");
                titleIcon.className = "w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 p-[1.5px] shrink-0 shadow-sm";
                titleIcon.innerHTML = `
                        <div class="w-full h-full bg-white rounded-[9px] flex items-center justify-center text-blue-600 font-black text-xs">
                            ${course.title.charAt(0).toUpperCase()}
                        </div>
                    `;

                const titleLink = document.createElement("a");
                titleLink.className = "font-black text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-1";
                titleLink.textContent = course.title;
                titleLink.href = Courses.detailsUrl(course.id);

                titleWrapper.appendChild(titleIcon);
                titleWrapper.appendChild(titleLink);
                titleCell.appendChild(titleWrapper);
                row.appendChild(titleCell);

                // Category Cell
                const catCell = document.createElement("td");
                catCell.className = "px-5 py-4";
                const catTag = document.createElement("span");
                catTag.className = "inline-flex items-center gap-1.5 rounded-full bg-sky-100 border border-sky-300 text-sky-900 px-2.5 py-0.5 text-xs font-black uppercase tracking-wider";
                catTag.innerHTML = `<i data-lucide="tag" class="w-3 h-3 text-sky-600"></i><span>${course.categoryName}</span>`;
                catCell.appendChild(catTag);
                row.appendChild(catCell);

                // Status Cell
                const statusCell = document.createElement("td");
                statusCell.className = "px-5 py-4";
                statusCell.appendChild(Courses.statusBadge(course.status));
                row.appendChild(statusCell);

                // Updated Date Cell
                const dateCell = document.createElement("td");
                dateCell.className = "px-5 py-4 font-bold text-slate-500 text-xs whitespace-nowrap";
                dateCell.innerHTML = `<span class="inline-flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-sky-500"></i>${Ui.formatDate(course.updatedAt || course.createdAt)}</span>`;
                row.appendChild(dateCell);

                // Actions Cell
                const actionCell = document.createElement("td");
                actionCell.className = "px-5 py-4 text-right";
                const group = document.createElement("div");
                group.className = "flex items-center justify-end gap-2";

                const edit = document.createElement("a");
                edit.className = "glitch-hover inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-black text-slate-700 hover:border-blue-300 hover:text-blue-600 transition-all active:scale-95 shadow-sm";
                edit.href = "/instructor/create-course.html?id=" + encodeURIComponent(course.id);
                edit.innerHTML = `<i data-lucide="edit-3" class="w-3.5 h-3.5"></i><span>Edit</span>`;
                group.appendChild(edit);

                const isPublished = course.status === "Published";
                group.appendChild(smallButton(
                    isPublished ? "Unpublish" : "Publish",
                    "border-sky-300 bg-sky-50/80 text-sky-900 hover:bg-sky-100",
                    isPublished ? "lock" : "rocket",
                    (button) => togglePublish(course, button)));

                group.appendChild(smallButton(
                    "Delete",
                    "border-rose-200 bg-rose-50/80 text-rose-600 hover:bg-rose-100",
                    "trash-2",
                    (button) => deleteCourse(course, button)));

                actionCell.appendChild(group);
                row.appendChild(actionCell);

                return row;
            }

            function render(data) {
                body.replaceChildren();

                if (data.items.length === 0) {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                            <td colspan="5" class="px-5 py-16 text-center">
                                <i data-lucide="search" class="w-10 h-10 mx-auto text-sky-400 mb-2"></i>
                                <h3 class="text-base font-black text-slate-800">No courses found</h3>
                                <p class="text-xs font-bold text-slate-500">Create a new course or adjust your filter selection.</p>
                            </td>
                        `;
                    body.appendChild(row);
                } else {
                    data.items.forEach(course => body.appendChild(buildRow(course)));
                }

                pageInfo.textContent = Courses.pagerText(data);
                prevBtn.disabled = data.page <= 1;
                nextBtn.disabled = data.page >= Math.max(data.totalPages, 1);

                lucide.createIcons();
            }

            async function loadCourses() {
                const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });

                if (state.search) {
                    params.set("search", state.search);
                }

                if (state.status) {
                    params.set("status", state.status);
                }

                try {
                    const data = await Api.get("/api/courses/mine?" + params.toString());

                    if (data.items.length === 0 && data.totalCount > 0 && state.page > 1) {
                        state.page = data.totalPages;
                        await loadCourses();
                        return;
                    }

                    render(data);
                } catch (error) {
                    showAlert(error.messages || ["Could not load your courses."], "error", "alert-circle");
                }
            }

            async function togglePublish(course, button) {
                const publish = course.status !== "Published";
                button.disabled = true;

                try {
                    await Api.post("/api/courses/" + course.id + (publish ? "/publish" : "/unpublish"));
                    await loadCourses();
                    showAlert("\"" + course.title + "\" was " + (publish ? "published." : "unpublished."), "success", publish ? "sparkles" : "lock", true);
                } catch (error) {
                    showAlert(error.messages || ["Could not update the course."], "error", "alert-triangle");
                    button.disabled = false;
                }
            }

            async function deleteCourse(course, button) {
                if (!window.confirm("Delete \"" + course.title + "\"? This cannot be undone.")) {
                    return;
                }

                button.disabled = true;

                try {
                    await Api.del("/api/courses/" + course.id);
                    await loadCourses();
                    showAlert("Course deleted successfully.", "success", "trash-2", true);
                } catch (error) {
                    showAlert(error.messages || ["Could not delete the course."], "error", "alert-triangle");
                    button.disabled = false;
                }
            }

            function showAlert(message, type = "error", iconName = "alert-triangle", autoDismiss = false) {
                const styles = {
                    error: "bg-rose-500/10 border-rose-300 text-rose-700",
                    success: "bg-emerald-500/10 border-emerald-300 text-emerald-700",
                    info: "bg-sky-500/10 border-sky-300 text-sky-700"
                };

                const msg = Array.isArray(message) ? message.join(" ") : message;

                listAlert.innerHTML = `
                        <div class="flex items-center gap-2.5 p-3.5 rounded-2xl border ${styles[type]} text-xs font-black backdrop-blur-md">
                            <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>
                            <span>${msg}</span>
                        </div>
                    `;
                lucide.createIcons();

                if (autoDismiss) {
                    setTimeout(clearAlert, 1000);
                }
            }

            function clearAlert() {
                listAlert.innerHTML = "";
            }

            document.getElementById("searchInput").addEventListener("input", Ui.debounce((event) => {
                state.search = event.target.value.trim();
                state.page = 1;
                clearAlert();
                loadCourses();
            }, 300));

            document.getElementById("statusFilter").addEventListener("change", (event) => {
                state.status = event.target.value;
                state.page = 1;
                clearAlert();
                loadCourses();
            });

            prevBtn.addEventListener("click", () => {
                if (state.page > 1) {
                    state.page--;
                    loadCourses();
                }
            });

            nextBtn.addEventListener("click", () => {
                state.page++;
                loadCourses();
            });

            loadCourses();
        }
    </script>
</body>
</html>
