<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

    <main class="w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-semibold text-slate-800">LearnHub</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to continue learning</p>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-6">
            <div id="alertBox" class="mb-4"></div>

            <form id="loginForm" class="space-y-4" novalidate>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input id="email" type="email" autocomplete="username"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" type="password" autocomplete="current-password"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <button id="submitBtn" type="submit"
                        class="w-full rounded-lg bg-blue-600 text-white py-2 text-sm font-medium hover:bg-blue-700">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-slate-500 mt-4">
            New here?
            <a href="/register.html" class="text-blue-600 hover:underline">Create an account</a>
        </p>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const alertBox = document.getElementById("alertBox");
        const form = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");

        // Already logged in? Go straight to your dashboard.
        const existingUser = Auth.getToken() ? Auth.getUser() : null;
        if (existingUser) {
            window.location.replace(Auth.homeFor(existingUser.role));
        }

        // Messages from other pages, e.g. /login.html?registered=1
        const params = new URLSearchParams(window.location.search);
        if (params.get("registered")) {
            Ui.showAlert(alertBox, "Account created. Please sign in.", "success");
        } else if (params.get("expired")) {
            Ui.showAlert(alertBox, "Your session has ended. Please sign in again.", "info");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            Ui.clearAlert(alertBox);

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                Ui.showAlert(alertBox, "Please enter your email and password.");
                return;
            }

            Ui.setBusy(submitBtn, true, "Signing in...");

            try {
                const data = await Api.post("/api/auth/login", { email, password });
                Auth.saveSession(data);
                window.location.href = Auth.homeFor(data.user.role);
            } catch (error) {
                Ui.showAlert(alertBox, error.messages || ["Something went wrong. Please try again."]);
                Ui.setBusy(submitBtn, false);
            }
        });
    </script>
</body>
</html>
